<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="static/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <title>Kalshi Bets Ensemble V11</title>
</head>
<body>
  <nav class="navbar">
    <a href="/weather" class="nav-link active inter-medium">weather</a>
    <a href="/sports" class="nav-link inter-medium">sports</a>
  </nav>

  <div class="titles-container">
    <h1 class="inter-semibold">Kalshi Weather Bets</h1>
    <h3 class="inter-medium">With Ensemble V11</h3>
  </div>

  <div class="content-container">
    <div class="settings-container">
      <div class="setting-group">
        <label class="inter-medium" for="kellyFraction">Kelly Fraction:</label>
        <input type="number" id="kellyFraction" value="0.50" min="0.1" max="1.0" step="0.05">
      </div>
      <div class="setting-group">
        <label class="inter-medium" for="startingBankroll">Starting Bankroll ($):</label>
        <input type="number" id="startingBankroll" value="40" min="1" step="1">
      </div>
      <div class="setting-group">
        <label class="inter-medium" for="targetDate">Target Date:</label>
        <select id="targetDate">
          <option value="auto">Auto (based on time)</option>
          <option value="today">Today</option>
          <option value="tomorrow">Tomorrow</option>
          <option value="custom">Custom Date</option>
        </select>
        <input type="date" id="customDate" style="display: none;">
      </div>
      <div class="setting-group">
        <label class="inter-medium" for="cityFilter">City:</label>
        <select id="cityFilter">
          <option value="all">All Cities</option>
          <option value="chicago">Chicago</option>
          <option value="nyc">New York City</option>
          <option value="miami">Miami</option>
        </select>
      </div>
    </div>
    <button class="inter-medium button" onclick="runModel()">Generate Picks</button>
  </div>
  <div id="loader" class="loader" style="display: none;"></div>

  <div class="output-container">
    <h3 class="inter-medium">Output</h3>
    <textarea id="outputBox"></textarea>
  </div>


  <script>
    // Show/hide custom date picker based on selection
    document.getElementById("targetDate").addEventListener("change", function() {
      const customDateInput = document.getElementById("customDate");
      if (this.value === "custom") {
        customDateInput.style.display = "block";
        // Set default to tomorrow
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        customDateInput.value = tomorrow.toISOString().split('T')[0];
      } else {
        customDateInput.style.display = "none";
      }
    });

    function runModel() {
      // Get settings values
      const kellyFraction = document.getElementById("kellyFraction").value;
      const startingBankroll = document.getElementById("startingBankroll").value;
      const targetDate = document.getElementById("targetDate").value;
      const customDate = document.getElementById("customDate").value;
      const cityFilter = document.getElementById("cityFilter").value;

      // Build URL with parameters
      let url = `/run-model?kelly=${kellyFraction}&bankroll=${startingBankroll}&dateOption=${targetDate}&city=${cityFilter}`;
      if (targetDate === "custom" && customDate) {
        url += `&customDate=${customDate}`;
      }

      // Show loader
      document.getElementById("loader").style.display = "block";

      // Clear output with loading message
      const cityName = cityFilter === "all" ? "all cities" : cityFilter;
      document.getElementById("outputBox").value = `Running Ensemble V11 for ${cityName}...\n\nFetching HRRR data, Open-Meteo, and NWS forecasts...\n\nThis may take 30-60 seconds.`;

      // Increase fetch timeout to 2 minutes
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 120000); // 2 minute timeout

      fetch(url, { signal: controller.signal })
        .then(response => response.json())
        .then(data => {
          clearTimeout(timeoutId);
          // Hide loader
          document.getElementById("loader").style.display = "none";

          // Show output
          if (data.error && data.error.trim() !== "") {
            document.getElementById("outputBox").value = 
              "ERROR:\n" + data.error + "\n\n" + (data.output || "");
          } else {
            document.getElementById("outputBox").value =
              data.output || "No output received.";
          }
        })
        .catch(err => {
          clearTimeout(timeoutId);
          document.getElementById("loader").style.display = "none";
          if (err.name === 'AbortError') {
            document.getElementById("outputBox").value = 
              "Request timed out after 2 minutes.\n\n" +
              "This usually means:\n" +
              "• HRRR data is taking too long to fetch\n" +
              "• Network issues accessing weather APIs\n\n" +
              "Try:\n" +
              "• Running with a single city filter\n" +
              "• Refreshing and trying again";
          } else {
            document.getElementById("outputBox").value = "Error: " + err;
          }
        });
    }
  </script>

</body>
</html>
