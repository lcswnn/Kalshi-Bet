<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="static/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <title>Kalshi Bets Ensemble V9</title>
</head>
<body>
  <nav class="navbar">
    <a href="/weather" class="nav-link active inter-medium">weather</a>
    <a href="/sports" class="nav-link inter-medium">sports</a>
  </nav>

  <div class="titles-container">
    <h1 class="inter-semibold"><span class="title-kalshi">Kalshi</span> <span class="title-weather-bets">Weather Bets</span></h1>
    <h3 class="inter-medium">With Ensemble V9</h3>
  </div>

  <div class="content-container">
    <div class="settings-container">
      <div class="setting-group">
        <label class="inter-medium" for="kellyFraction">Kelly Fraction:</label>
        <input type="number" id="kellyFraction" value="0.50" min="0.1" max="1.0" step="0.05">
      </div>
      <div class="setting-group">
        <label class="inter-medium" for="startingBankroll">Starting Bankroll ($):</label>
        <input type="number" id="startingBankroll" value="40" min="1" step="1">
      </div>
      <div class="setting-group">
        <label class="inter-medium" for="targetDate">Target Date:</label>
        <select id="targetDate">
          <option value="auto">Auto (based on time)</option>
          <option value="today">Today</option>
          <option value="tomorrow">Tomorrow</option>
          <option value="custom">Custom Date</option>
        </select>
        <input type="date" id="customDate" style="display: none;">
      </div>
      <div class="setting-group">
        <label class="inter-medium" for="cityFilter">City:</label>
        <select id="cityFilter">
          <option value="all">All Cities</option>
          <option value="chicago">Chicago</option>
          <option value="nyc">New York City</option>
          <option value="miami">Miami</option>
          <option value="austin">Austin</option>
          <option value="la">Los Angeles</option>
        </select>
      </div>
    </div>
    <button class="inter-medium button" onclick="runModel()">Generate Picks</button>
  </div>
  <div id="loader" class="loader" style="display: none;"></div>

  <!-- Results Display Area -->
  <div id="resultsContainer" class="results-container" style="display: none;">
    <!-- Prediction Date Header -->
    <div id="predictionDateHeader" class="prediction-date-header">
      <h2 class="inter-semibold" id="predictionDateText"></h2>
    </div>

    <!-- City Forecasts Section -->
    <div id="forecastsSection" class="forecasts-section"></div>

    <!-- Betting Recommendations Section -->
    <div id="betsSection" class="bets-section"></div>
  </div>

  <!-- Raw output toggle (for debugging) -->
  <div class="raw-output-container" style="display: none;">
    <button class="inter-medium toggle-raw-btn" onclick="toggleRawOutput()">Show Raw Output</button>
    <textarea id="rawOutputBox" style="display: none;"></textarea>
  </div>


  <script>
    // Show/hide custom date picker based on selection
    document.getElementById("targetDate").addEventListener("change", function() {
      const customDateInput = document.getElementById("customDate");
      if (this.value === "custom") {
        customDateInput.style.display = "block";
        // Set default to tomorrow
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        customDateInput.value = tomorrow.toISOString().split('T')[0];
      } else {
        customDateInput.style.display = "none";
      }
    });

    function toggleRawOutput() {
      const rawBox = document.getElementById("rawOutputBox");
      const btn = document.querySelector(".toggle-raw-btn");
      if (rawBox.style.display === "none") {
        rawBox.style.display = "block";
        btn.textContent = "Hide Raw Output";
      } else {
        rawBox.style.display = "none";
        btn.textContent = "Show Raw Output";
      }
    }

    function parseModelOutput(text) {
      const lines = text.split('\n');
      const data = {
        forecasts: [],
        bets: [],
        summary: {},
        warnings: []
      };

      let currentSection = null;
      let currentCity = null;
      let currentBet = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        // Detect sections
        if (line.includes('FORECAST ANALYSIS BY CITY')) {
          currentSection = 'forecasts';
        } else if (line.includes('BETTING RECOMMENDATIONS')) {
          currentSection = 'bets';
        } else if (line.includes('PORTFOLIO SUMMARY')) {
          currentSection = 'summary';
        }

        // Parse city forecasts
        if (currentSection === 'forecasts' && line.match(/🏙️\s+(.+)/)) {
          if (currentCity) data.forecasts.push(currentCity);
          currentCity = {
            name: line.match(/🏙️\s+(.+)/)[1].trim(),
            models: [],
            spread: '',
            uncertainty: '',
            wind: '',
            airmass: '',
            mlAdjustments: [],
            finalForecast: '',
            predictedBin: '',
            warnings: []
          };
        } else if (currentCity) {
          if (line.includes('HRRR:') || line.includes('Open-Meteo:') || line.includes('NWS:')) {
            const match = line.match(/(HRRR|Open-Meteo|NWS):\s*([\d.]+)°F/);
            if (match) currentCity.models.push({ name: match[1], temp: match[2] });
          } else if (line.includes('Ensemble Forecast:')) {
            const match = line.match(/Ensemble Forecast:\s*([\d.]+°F)/);
            if (match) currentCity.finalForecast = match[1];
          } else if (line.includes('Forecast Uncertainty:')) {
            const match = line.match(/Forecast Uncertainty:\s*([±\d.]+°F)/);
            if (match) currentCity.uncertainty = match[1];
          } else if (line.includes('Model Spread:')) {
            currentCity.spread = line.match(/Model Spread:\s*(.+)/)[1];
          } else if (line.includes('🌬️')) {
            currentCity.wind = line.replace(/\s*🌬️\s*/, '').trim();
          } else if (line.includes('🌡️')) {
            currentCity.airmass = line.replace(/\s*🌡️\s*/, '').trim();
          } else if (line.includes('• ') && line.includes('ML')) {
            currentCity.mlAdjustments.push(line.replace(/.*•\s*/, '').trim());
          } else if (line.includes('Predicted Bin:') || line.includes('📍')) {
            const match = line.match(/(?:Predicted Bin:|📍)\s*(.+)/);
            if (match) currentCity.predictedBin = match[1].trim();
          } else if (line.includes('WARNING:') || line.includes('⚠️')) {
            currentCity.warnings.push(line.replace(/.*(?:WARNING:|⚠️)\s*/, '').trim());
          }
        }

        // Parse bets
        if (currentSection === 'bets' && line.match(/BET #(\d+):/)) {
          if (currentBet) data.bets.push(currentBet);
          const betMatch = line.match(/BET #(\d+):\s*(\w+(?:\s+\w+)*)\s*-\s*(.+)/);
          if (betMatch) {
            currentBet = {
              number: betMatch[1],
              city: betMatch[2],
              confidence: betMatch[3],
              contract: '',
              side: '',
              edge: {},
              sizing: {},
              forecast: '',
              agreement: ''
            };
          }
        } else if (currentBet) {
          if (line.includes('Contract:')) {
            currentBet.contract = line.match(/Contract:\s*(.+)/)[1];
          } else if (line.includes('Side:')) {
            currentBet.side = line.match(/Side:\s*(.+)/)[1];
          } else if (line.includes('Your probability:')) {
            const match = line.match(/Your probability:\s*([\d.]+)%\s*\|\s*Market:\s*([\d.]+)%/);
            if (match) {
              currentBet.edge.yourProb = match[1];
              currentBet.edge.marketProb = match[2];
            }
          } else if (line.includes('Edge:')) {
            const match = line.match(/Edge:\s*([+-]?[\d.]+)%\s*\((.+)\)/);
            if (match) {
              currentBet.edge.percentage = match[1];
              currentBet.edge.ratio = match[2];
            }
          } else if (line.includes('Kelly %:')) {
            currentBet.sizing.kelly = line.match(/Kelly %:\s*([\d.]+)%/)[1];
          } else if (line.includes('BET') && line.match(/\$[\d.]+/)) {
            // Match "BET: $X" or "➜  BET: $X" or "➜  BET (scaled...): $X"
            const match = line.match(/\$([\d.]+)/);
            if (match && !currentBet.sizing.amount) {
              currentBet.sizing.amount = match[1];
            }
          } else if (line.includes('If you win:')) {
            const match = line.match(/If you win:\s*\$?([\d.]+)\s*profit\s*\(([\d.]+)% ROI\)/);
            if (match) {
              currentBet.sizing.profit = match[1];
              currentBet.sizing.roi = match[2];
            }
          } else if (line.includes('MODEL FORECAST:')) {
            currentBet.forecast = line.match(/MODEL FORECAST:\s*(.+)/)[1];
          } else if (line.includes('Agreement level:')) {
            currentBet.agreement = line.match(/Agreement level:\s*(.+)/)[1];
          }
        }

        // Parse summary
        if (currentSection === 'summary') {
          if (line.includes('Total bets:')) {
            data.summary.totalBets = line.match(/Total bets:\s*(\d+)/)[1];
          } else if (line.includes('Total wager:')) {
            const match = line.match(/Total wager:\s*\$?([\d.]+)\s*\(([\d.]+)%/);
            if (match) {
              data.summary.totalWager = match[1];
              data.summary.wagerPercent = match[2];
            }
          } else if (line.includes('Total potential profit:')) {
            data.summary.totalProfit = line.match(/Total potential profit:\s*\$?([\d.]+)/)[1];
          } else if (line.includes('Portfolio ROI')) {
            data.summary.portfolioROI = line.match(/Portfolio ROI.*:\s*([\d.]+)%/)[1];
          }
        }

        // Capture warnings
        if (line.includes('⚠️') || line.includes('WARNING') || line.includes('🚨')) {
          data.warnings.push(line.trim());
        }
      }

      // Push last items
      if (currentCity) data.forecasts.push(currentCity);
      if (currentBet) data.bets.push(currentBet);

      return data;
    }

    function displayResults(data) {
      const forecastsSection = document.getElementById('forecastsSection');
      const betsSection = document.getElementById('betsSection');

      // Clear previous results
      forecastsSection.innerHTML = '';
      betsSection.innerHTML = '';

      // Helper to format city names
      function formatCityName(name) {
        const cityMap = {
          'NYC': 'New York',
          'NEW YORK CITY': 'New York',
          'CHICAGO': 'Chicago',
          'MIAMI': 'Miami',
          'AUSTIN': 'Austin',
          'LA': 'Los Angeles',
          'LOS ANGELES': 'Los Angeles'
        };
        return cityMap[name.toUpperCase()] || name;
      }

      // Display forecasts
      if (data.forecasts.length > 0) {
        forecastsSection.innerHTML += '<h2 class="inter-semibold section-title">📊 Forecast Analysis</h2>';
        data.forecasts.forEach(city => {
          const displayName = formatCityName(city.name);
          const cityHtml = `
            <div class="forecast-card">
              <h3 class="inter-semibold city-name">${displayName}</h3>
              
              ${city.models.length > 0 ? `
                <div class="models-section">
                  <p class="inter-medium subsection-label">Model Forecasts</p>
                  ${city.models.map(m => `
                    <div class="model-item inter-medium">
                      <span class="model-name">${m.name}</span>
                      <span class="model-temp">${m.temp}°F</span>
                    </div>
                  `).join('')}
                </div>
              ` : ''}

              ${city.spread ? `<p class="inter-medium spread-info">${city.spread}</p>` : ''}
              ${city.wind ? `<p class="inter-medium atmospheric-info">🌬️ ${city.wind}</p>` : ''}
              ${city.airmass ? `<p class="inter-medium atmospheric-info">🌡️ ${city.airmass}</p>` : ''}
              
              ${city.mlAdjustments.length > 0 ? `
                <div class="ml-adjustments">
                  <p class="inter-medium subsection-label">🤖 ML Adjustments</p>
                  ${city.mlAdjustments.map(adj => `<p class="inter-medium adjustment-item">• ${adj}</p>`).join('')}
                </div>
              ` : ''}

              <div class="final-forecast">
                <p class="inter-semibold forecast-value">⭐ Ensemble Forecast: ${city.finalForecast}</p>
                ${city.predictedBin ? `<p class="inter-medium bin-value">📍 ${city.predictedBin}</p>` : ''}
              </div>

              ${city.warnings.length > 0 ? `
                <div class="city-warnings">
                  ${city.warnings.map(w => `<p class="inter-medium">🚨 ${w}</p>`).join('')}
                </div>
              ` : ''}
            </div>
          `;
          forecastsSection.innerHTML += cityHtml;
        });
      }

      // Display bets
      if (data.bets.length > 0) {
        betsSection.innerHTML += '<h2 class="inter-semibold section-title">💰 Recommended Bets</h2>';
        
        data.bets.forEach(bet => {
          const betHtml = `
            <div class="bet-card">
              <div class="bet-header">
                <span class="inter-semibold bet-number">BET #${bet.number}</span>
                <span class="inter-medium bet-city">${bet.city}</span>
                <span class="inter-medium confidence-badge">${bet.confidence}</span>
              </div>

              <div class="bet-details">
                <div class="detail-row">
                  <span class="inter-medium label">Contract:</span>
                  <span class="inter-medium value">${bet.contract}</span>
                </div>
                <div class="detail-row">
                  <span class="inter-medium label">Side:</span>
                  <span class="inter-medium value">${bet.side}</span>
                </div>
              </div>

              ${bet.edge.yourProb ? `
                <div class="edge-section">
                  <p class="inter-semibold subsection-title">📊 The Edge</p>
                  <div class="edge-stats">
                    <div class="stat-item">
                      <span class="inter-medium stat-label">Your Probability</span>
                      <span class="inter-semibold stat-value">${bet.edge.yourProb}%</span>
                    </div>
                    <div class="stat-item">
                      <span class="inter-medium stat-label">Market Price</span>
                      <span class="inter-semibold stat-value">${bet.edge.marketProb}%</span>
                    </div>
                    <div class="stat-item highlight">
                      <span class="inter-medium stat-label">Edge</span>
                      <span class="inter-semibold stat-value">${bet.edge.percentage}%</span>
                    </div>
                  </div>
                  ${bet.edge.ratio ? `<p class="inter-medium edge-ratio">${bet.edge.ratio}</p>` : ''}
                </div>
              ` : ''}

              ${bet.sizing.amount ? `
                <div class="sizing-section">
                  <p class="inter-semibold subsection-title">💵 Position Sizing</p>
                  <div class="sizing-stats">
                    <div class="stat-item">
                      <span class="inter-medium stat-label">Kelly %</span>
                      <span class="inter-semibold stat-value">${bet.sizing.kelly}%</span>
                    </div>
                    <div class="stat-item highlight">
                      <span class="inter-medium stat-label">Bet Amount</span>
                      <span class="inter-semibold stat-value">$${bet.sizing.amount}</span>
                    </div>
                    ${bet.sizing.profit ? `
                      <div class="stat-item success">
                        <span class="inter-medium stat-label">Potential Profit</span>
                        <span class="inter-semibold stat-value">$${bet.sizing.profit} (${bet.sizing.roi}% ROI)</span>
                      </div>
                    ` : ''}
                  </div>
                </div>
              ` : ''}

              <div class="model-info">
                ${bet.agreement ? `<p class="inter-medium">Agreement: ${bet.agreement}</p>` : ''}
              </div>
            </div>
          `;
          betsSection.innerHTML += betHtml;
        });

        // Add summary
        if (data.summary.totalBets) {
          const summaryHtml = `
            <div class="portfolio-summary">
              <h3 class="inter-semibold">📊 Portfolio Summary</h3>
              <div class="summary-grid">
                <div class="summary-item">
                  <span class="inter-medium">Total Bets</span>
                  <span class="inter-semibold">${data.summary.totalBets}</span>
                </div>
                <div class="summary-item">
                  <span class="inter-medium">Total Wager</span>
                  <span class="inter-semibold">$${data.summary.totalWager} (${data.summary.wagerPercent}%)</span>
                </div>
                <div class="summary-item">
                  <span class="inter-medium">Potential Profit</span>
                  <span class="inter-semibold success">$${data.summary.totalProfit}</span>
                </div>
                ${data.summary.portfolioROI ? `
                  <div class="summary-item">
                    <span class="inter-medium">Portfolio ROI</span>
                    <span class="inter-semibold success">${data.summary.portfolioROI}%</span>
                  </div>
                ` : ''}
              </div>
            </div>
          `;
          betsSection.innerHTML += summaryHtml;
        }
      } else {
        betsSection.innerHTML += `
          <div class="no-bets-message">
            <h3 class="inter-semibold">🛑 No Bets Recommended Today</h3>
            <p class="inter-medium">No qualifying opportunities found. This could mean:</p>
            <ul class="inter-medium">
              <li>Models disagree significantly</li>
              <li>No contracts with sufficient edge</li>
              <li>Market is efficiently priced</li>
            </ul>
            <p class="inter-medium">💡 Sitting out is a valid strategy!</p>
          </div>
        `;
      }
    }

    function runModel() {
      // Get settings values
      const kellyFraction = document.getElementById("kellyFraction").value;
      const startingBankroll = document.getElementById("startingBankroll").value;
      const targetDate = document.getElementById("targetDate").value;
      const customDate = document.getElementById("customDate").value;
      const cityFilter = document.getElementById("cityFilter").value;

      // Build URL with parameters
      let url = `/run-model?kelly=${kellyFraction}&bankroll=${startingBankroll}&dateOption=${targetDate}&city=${cityFilter}`;
      if (targetDate === "custom" && customDate) {
        url += `&customDate=${customDate}`;
      }

      // Show loader, hide results
      document.getElementById("loader").style.display = "block";
      document.getElementById("resultsContainer").style.display = "none";

      // Increase fetch timeout to 5 minutes (matches backend timeout)
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 300000); // 5 minute timeout

      fetch(url, { signal: controller.signal })
        .then(response => response.json())
        .then(data => {
          clearTimeout(timeoutId);
          document.getElementById("loader").style.display = "none";

          // Store raw output
          document.getElementById("rawOutputBox").value = data.output || data.error || "";

          if (data.success !== false && data.output) {
            // Display prediction date
            if (data.prediction_date) {
              document.getElementById("predictionDateText").textContent =
                "Predictions for " + data.prediction_date;
            }

            // Parse and display results
            const parsedData = parseModelOutput(data.output);
            displayResults(parsedData);
            document.getElementById("resultsContainer").style.display = "block";
          } else {
            // Show error
            document.getElementById("resultsContainer").innerHTML = `
              <div class="error-message">
                <h3 class="inter-semibold">❌ Error</h3>
                <p class="inter-medium">${data.error || "Unknown error occurred"}</p>
              </div>
            `;
            document.getElementById("resultsContainer").style.display = "block";
          }
        })
        .catch(err => {
          clearTimeout(timeoutId);
          document.getElementById("loader").style.display = "none";
          
          let errorMsg = "Unknown error occurred";
          if (err.name === 'AbortError') {
            errorMsg = `Request timed out after 5 minutes.

This usually means:
• HRRR data is taking too long to fetch
• Network issues accessing weather APIs

Try:
• Running with a single city filter
• Refreshing and trying again`;
          } else {
            errorMsg = err.toString();
          }

          document.getElementById("resultsContainer").innerHTML = `
            <div class="error-message">
              <h3 class="inter-semibold">❌ Error</h3>
              <pre class="inter-medium">${errorMsg}</pre>
            </div>
          `;
          document.getElementById("resultsContainer").style.display = "block";
        });
    }
  </script>

</body>
</html>
