<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="static/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <title>Kalshi Bets Ensemble V9.3.1</title>
</head>
<body>
  <nav class="navbar">
    <a href="/weather" class="nav-link active inter-medium">weather</a>
    <a href="/sports" class="nav-link inter-medium">sports</a>
  </nav>

  <div class="titles-container">
    <h1 class="inter-semibold"><span class="title-kalshi">Kalshi</span> <span class="title-weather-bets">Weather Bets</span></h1>
    <h3 class="inter-medium">With Ensemble V9.3.1</h3>
  </div>

  <div class="content-container">
    <div class="settings-container">
      <div class="setting-group">
        <label class="inter-medium" for="startingBankroll">Bankroll ($):</label>
        <input type="number" id="startingBankroll" value="100" min="1" step="1">
      </div>
      <div class="setting-group">
        <label class="inter-medium" for="targetDate">Date:</label>
        <select id="targetDate">
          <option value="today">Today</option>
          <option value="tomorrow" selected>Tomorrow</option>
        </select>
      </div>
      <div class="setting-group">
        <label class="inter-medium" for="cityFilter">Cities:</label>
        <select id="cityFilter">
          <option value="austin,miami">Austin + Miami</option>
          <option value="all">All Cities</option>
        </select>
      </div>
    </div>
    <button class="inter-medium button" onclick="runModel()">Generate Picks</button>
  </div>
  <div id="loader" class="loader" style="display: none;"></div>

  <!-- Results Display Area -->
  <div id="resultsContainer" class="results-container" style="display: none;">
    <!-- Prediction Date Header -->
    <div id="predictionDateHeader" class="prediction-date-header">
      <h2 class="inter-semibold" id="predictionDateText"></h2>
    </div>

    <!-- City Forecasts Section -->
    <div id="forecastsSection" class="forecasts-section"></div>

    <!-- Betting Recommendations Section -->
    <div id="betsSection" class="bets-section"></div>
  </div>

  <!-- Raw output toggle (for debugging) -->
  <div class="raw-output-container" style="display: none;">
    <button class="inter-medium toggle-raw-btn" onclick="toggleRawOutput()">Show Raw Output</button>
    <textarea id="rawOutputBox" style="display: none;"></textarea>
  </div>


  <script>
    // Store bankroll and bet data globally for Kelly calculations
    let globalBankroll = 100;
    let globalBetsData = [];

    function toggleRawOutput() {
      const rawBox = document.getElementById("rawOutputBox");
      const btn = document.querySelector(".toggle-raw-btn");
      if (rawBox.style.display === "none") {
        rawBox.style.display = "block";
        btn.textContent = "Hide Raw Output";
      } else {
        rawBox.style.display = "none";
        btn.textContent = "Show Raw Output";
      }
    }

    function parseModelOutput(text) {
      const lines = text.split('\n');
      const data = {
        forecasts: [],
        bets: [],
        summary: {},
        warnings: []
      };

      let currentSection = null;
      let currentCity = null;
      let currentBet = null;
      // Track current model being parsed (for v9 format where forecast comes on next line)
      let currentModelName = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        // Detect sections - v9 format
        if (line.includes('FORECAST ANALYSIS BY CITY') || line.includes('ANALYZING:')) {
          currentSection = 'forecasts';
        } else if (line.includes('BETTING RECOMMENDATIONS')) {
          currentSection = 'bets';
        } else if (line.includes('PORTFOLIO SUMMARY') || line.includes('TOTAL WAGER:')) {
          currentSection = 'summary';
        }

        // Parse city forecasts - v9 format uses "ANALYZING: CHICAGO" instead of "🏙️ Chicago"
        if (currentSection === 'forecasts' && (line.match(/🏙️\s+(.+)/) || line.match(/ANALYZING:\s+(.+)/))) {
          if (currentCity) data.forecasts.push(currentCity);
          const cityMatch = line.match(/🏙️\s+(.+)/) || line.match(/ANALYZING:\s+(.+)/);
          currentCity = {
            name: cityMatch[1].trim(),
            models: [],
            spread: '',
            uncertainty: '',
            wind: '',
            airmass: '',
            mlAdjustments: [],
            finalForecast: '',
            predictedBin: '',
            warnings: []
          };
          currentModelName = null;
        } else if (currentCity) {
          // v9 model format: "[1] Open-Meteo:" on one line, then "✅ Forecast: 41.8°F" on next
          // First, detect model header lines
          if (line.includes('[1] Open-Meteo:') || line.includes('[1] Open-Meteo')) {
            currentModelName = 'Open-Meteo';
          } else if (line.includes('[2] HRRR')) {
            currentModelName = 'HRRR';
          } else if (line.includes('[3] NWS')) {
            currentModelName = 'NWS';
          }

          // v9 format: direct model output like "HRRR: 41.8°F" or "Open-Meteo: 41.8°F"
          if (line.includes('HRRR:') || line.includes('Open-Meteo:') || line.includes('NWS:')) {
            const match = line.match(/(HRRR|Open-Meteo|NWS):\s*([\d.]+)°F/);
            if (match) {
              // Only add if we don't already have this model
              const existingModel = currentCity.models.find(m => m.name === match[1]);
              if (!existingModel) {
                currentCity.models.push({ name: match[1], temp: match[2] });
              }
            }
          } else if (line.includes('✅ Forecast:')) {
            // v9 format for individual model forecasts - use tracked model name
            const match = line.match(/Forecast:\s*([\d.]+)°F/);
            if (match) {
              // Use the model name we tracked from the header line
              const modelName = currentModelName || 'Forecast';
              // Only add if we don't already have this model
              const existingModel = currentCity.models.find(m => m.name === modelName);
              if (!existingModel) {
                currentCity.models.push({ name: modelName, temp: match[1] });
              }
              currentModelName = null; // Reset after using
            }
          } else if (line.includes('ENSEMBLE FORECAST:')) {
            // v9 format: "🎯 ENSEMBLE FORECAST: 43.0°F"
            const match = line.match(/ENSEMBLE FORECAST:\s*([\d.]+)°F/);
            if (match) currentCity.finalForecast = match[1] + '°F';
          } else if (line.includes('Ensemble Forecast:')) {
            const match = line.match(/Ensemble Forecast:\s*([\d.]+°F)/);
            if (match) currentCity.finalForecast = match[1];
          } else if (line.includes('Forecast Uncertainty:')) {
            const match = line.match(/Forecast Uncertainty:\s*([±\d.]+°F)/);
            if (match) currentCity.uncertainty = match[1];
          } else if (line.includes('Model Spread:') || line.includes('Spread:')) {
            const match = line.match(/(?:Model )?Spread:\s*(.+)/);
            if (match) currentCity.spread = match[1].replace(/→.*/, '').trim();
          } else if (line.includes('🌬️')) {
            currentCity.wind = line.replace(/\s*🌬️\s*/, '').trim();
          } else if (line.includes('🌡️')) {
            currentCity.airmass = line.replace(/\s*🌡️\s*/, '').trim();
          } else if (line.includes('• ') && line.includes('ML')) {
            currentCity.mlAdjustments.push(line.replace(/.*•\s*/, '').trim());
          } else if (line.includes('Primary bin:')) {
            // v9 format: "Primary bin: 43°-44°F"
            const match = line.match(/Primary bin:\s*(.+)/);
            if (match) currentCity.predictedBin = match[1].trim();
          } else if (line.includes('Predicted Bin:') || line.includes('📍')) {
            const match = line.match(/(?:Predicted Bin:|📍)\s*(.+)/);
            if (match) currentCity.predictedBin = match[1].trim();
          } else if (line.includes('WARNING:') || line.includes('⚠️')) {
            currentCity.warnings.push(line.replace(/.*(?:WARNING:|⚠️)\s*/, '').trim());
          }
        }

        // Parse bets - v9 format: "BET #1: Chicago (best in city)" with confidence on next line
        if (currentSection === 'bets' && line.includes('BET #')) {
          if (currentBet) data.bets.push(currentBet);
          // Match format: "┌─ BET #1: Chicago (reason)" or "BET #1: Chicago - confidence"
          const betMatch = line.match(/BET #(\d+):\s*(\w+)/);
          if (betMatch) {
            currentBet = {
              number: betMatch[1],
              city: betMatch[2],
              confidence: '',
              contract: '',
              side: '',
              edge: {},
              sizing: {},
              forecast: '',
              agreement: ''
            };
          }
        } else if (currentBet) {
          // Parse confidence line (comes right after BET # line in v9)
          if ((line.includes('SUPER CONFIDENT') || line.includes('High confidence') || line.includes('Best opportunity')) && !currentBet.confidence) {
            currentBet.confidence = line.replace(/[│┌└─\s]*/g, '').trim();
          } else if (line.includes('Contract:')) {
            const match = line.match(/Contract:\s*(.+)/);
            if (match) currentBet.contract = match[1].replace(/[│📍]/g, '').trim();
          } else if (line.includes('Side:')) {
            const match = line.match(/Side:\s*(.+)/);
            if (match) currentBet.side = match[1].replace(/[│📊]/g, '').trim();
            // v9 format: "Side: YES at 50¢" - extract market price
            const priceMatch = line.match(/at\s*(\d+)¢/);
            if (priceMatch) {
              currentBet.edge.marketProb = priceMatch[1]; // Store as percentage (e.g., "50" for 50%)
            }
          } else if (line.includes('Your probability:')) {
            // v9 format: "Your probability: 97.9%" (no market prob on same line)
            const match = line.match(/Your probability:\s*([\d.]+)%/);
            if (match) {
              currentBet.edge.yourProb = match[1];
            }
          } else if (line.includes('Edge:')) {
            // v9 format: "Edge: +32.4% (2.2x minimum)"
            const match = line.match(/Edge:\s*([+-]?[\d.]+)%\s*\((.+)\)/);
            if (match) {
              currentBet.edge.percentage = match[1];
              currentBet.edge.ratio = match[2];
            }
          } else if (line.includes('Kelly:')) {
            // v9 format: "Kelly: 15.0% of bankroll"
            const match = line.match(/Kelly:\s*([\d.]+)%/);
            if (match) currentBet.sizing.kelly = match[1];
          } else if (line.includes('💰 BET:')) {
            // v9 format: "💰 BET: $6.00"
            const match = line.match(/\$([\d.]+)/);
            if (match && !currentBet.sizing.amount) {
              currentBet.sizing.amount = match[1];
            }
          } else if (line.includes('📈 Potential profit:')) {
            // v9 format: "📈 Potential profit: $3.16"
            const match = line.match(/\$([\d.]+)/);
            if (match) {
              currentBet.sizing.profit = match[1];
              // Calculate ROI if we have bet amount
              if (currentBet.sizing.amount) {
                const profit = parseFloat(match[1]);
                const amount = parseFloat(currentBet.sizing.amount);
                if (amount > 0) {
                  currentBet.sizing.roi = ((profit / amount) * 100).toFixed(1);
                }
              }
            }
          } else if (line.includes('If you win:')) {
            const match = line.match(/If you win:\s*\$?([\d.]+)\s*profit\s*\(([\d.]+)% ROI\)/);
            if (match) {
              currentBet.sizing.profit = match[1];
              currentBet.sizing.roi = match[2];
            }
          } else if (line.includes('MODEL FORECAST:')) {
            currentBet.forecast = line.match(/MODEL FORECAST:\s*(.+)/)[1];
          } else if (line.includes('Agreement level:')) {
            currentBet.agreement = line.match(/Agreement level:\s*(.+)/)[1];
          }
        }

        // Parse summary - v9 format: "TOTAL WAGER: $6.00 (15.0% of bankroll)"
        if (currentSection === 'summary') {
          if (line.includes('Total bets:')) {
            data.summary.totalBets = line.match(/Total bets:\s*(\d+)/)[1];
          } else if (line.includes('TOTAL WAGER:') || line.includes('Total wager:')) {
            // v9 format: "TOTAL WAGER: $6.00 (15.0% of bankroll)"
            const match = line.match(/TOTAL WAGER:\s*\$?([\d.]+)\s*\(([\d.]+)%/) ||
                          line.match(/Total wager:\s*\$?([\d.]+)\s*\(([\d.]+)%/);
            if (match) {
              data.summary.totalWager = match[1];
              data.summary.wagerPercent = match[2];
            }
          } else if (line.includes('POTENTIAL PROFIT:') || line.includes('Total potential profit:')) {
            // v9 format: "POTENTIAL PROFIT: $3.16"
            const match = line.match(/(?:POTENTIAL PROFIT|Total potential profit):\s*\$?([\d.]+)/);
            if (match) data.summary.totalProfit = match[1];
          } else if (line.includes('Portfolio ROI')) {
            const match = line.match(/Portfolio ROI.*:\s*([\d.]+)%/);
            if (match) data.summary.portfolioROI = match[1];
          }
        }

        // Capture warnings
        if (line.includes('⚠️') || line.includes('WARNING') || line.includes('🚨')) {
          data.warnings.push(line.trim());
        }
      }

      // Push last items
      if (currentCity) data.forecasts.push(currentCity);
      if (currentBet) data.bets.push(currentBet);

      return data;
    }

    function displayResults(data) {
      const forecastsSection = document.getElementById('forecastsSection');
      const betsSection = document.getElementById('betsSection');

      // Clear previous results
      forecastsSection.innerHTML = '';
      betsSection.innerHTML = '';

      // Helper to format city names
      function formatCityName(name) {
        const cityMap = {
          'NYC': 'New York',
          'NEW YORK': 'New York',
          'NEW YORK CITY': 'New York',
          'CHICAGO': 'Chicago',
          'MIAMI': 'Miami',
          'AUSTIN': 'Austin',
          'LA': 'Los Angeles',
          'LOS ANGELES': 'Los Angeles'
        };
        return cityMap[name.toUpperCase()] || name;
      }

      // Display forecasts
      if (data.forecasts.length > 0) {
        forecastsSection.innerHTML += '<h2 class="inter-semibold section-title">📊 Forecast Analysis</h2>';
        data.forecasts.forEach(city => {
          const displayName = formatCityName(city.name);
          const cityHtml = `
            <div class="forecast-card">
              <h3 class="inter-semibold city-name">${displayName}</h3>
              
              ${city.models.length > 0 ? `
                <div class="models-section">
                  <p class="inter-medium subsection-label">Model Forecasts</p>
                  ${city.models.map(m => `
                    <div class="model-item inter-medium">
                      <span class="model-name">${m.name}</span>
                      <span class="model-temp">${m.temp}°F</span>
                    </div>
                  `).join('')}
                </div>
              ` : ''}

              ${city.spread ? `<p class="inter-medium spread-info">${city.spread}</p>` : ''}
              ${city.wind ? `<p class="inter-medium atmospheric-info">🌬️ ${city.wind}</p>` : ''}
              ${city.airmass ? `<p class="inter-medium atmospheric-info">🌡️ ${city.airmass}</p>` : ''}
              
              ${city.mlAdjustments.length > 0 ? `
                <div class="ml-adjustments">
                  <p class="inter-medium subsection-label">🤖 ML Adjustments</p>
                  ${city.mlAdjustments.map(adj => `<p class="inter-medium adjustment-item">• ${adj}</p>`).join('')}
                </div>
              ` : ''}

              <div class="final-forecast">
                <p class="inter-semibold forecast-value">⭐ Ensemble Forecast: ${city.finalForecast}</p>
                ${city.predictedBin ? `<p class="inter-medium bin-value">📍 ${city.predictedBin}</p>` : ''}
              </div>

              ${city.warnings.length > 0 ? `
                <div class="city-warnings">
                  ${city.warnings.map(w => `<p class="inter-medium">🚨 ${w}</p>`).join('')}
                </div>
              ` : ''}
            </div>
          `;
          forecastsSection.innerHTML += cityHtml;
        });
      }

      // Display bets
      if (data.bets.length > 0) {
        // Store bets data globally for Kelly calculations
        globalBetsData = data.bets;

        betsSection.innerHTML += '<h2 class="inter-semibold section-title">💰 Recommended Bets</h2>';

        data.bets.forEach((bet, index) => {
          // Calculate full Kelly values for this bet
          const yourProb = parseFloat(bet.edge.yourProb) / 100;
          const marketProb = parseFloat(bet.edge.marketProb) / 100;
          const odds = (1 - marketProb) / marketProb; // Decimal odds minus 1
          const fullKelly = yourProb - ((1 - yourProb) / odds);
          const fullKellyPercent = Math.max(0, fullKelly * 100);

          // Store calculated values in bet object
          bet.fullKellyPercent = fullKellyPercent;
          bet.yourProbDecimal = yourProb;
          bet.marketProbDecimal = marketProb;

          const betHtml = `
            <div class="bet-card" id="bet-card-${index}">
              <div class="bet-header">
                <span class="inter-semibold bet-number">BET #${bet.number}</span>
                <span class="inter-medium bet-city">${bet.city}</span>
                <span class="inter-medium confidence-badge">${bet.confidence}</span>
              </div>

              <div class="bet-details">
                <div class="detail-row">
                  <span class="inter-medium label">Contract:</span>
                  <span class="inter-medium value">${bet.contract}</span>
                </div>
                <div class="detail-row">
                  <span class="inter-medium label">Side:</span>
                  <span class="inter-medium value">${bet.side}</span>
                </div>
              </div>

              ${bet.edge.yourProb ? `
                <div class="edge-section">
                  <p class="inter-semibold subsection-title">📊 The Edge</p>
                  <div class="edge-stats">
                    <div class="stat-item">
                      <span class="inter-medium stat-label">Your Probability</span>
                      <span class="inter-semibold stat-value">${bet.edge.yourProb}%</span>
                    </div>
                    <div class="stat-item">
                      <span class="inter-medium stat-label">Market Price</span>
                      <span class="inter-semibold stat-value">${bet.edge.marketProb}%</span>
                    </div>
                    <div class="stat-item highlight">
                      <span class="inter-medium stat-label">Edge</span>
                      <span class="inter-semibold stat-value">${bet.edge.percentage}%</span>
                    </div>
                  </div>
                  ${bet.edge.ratio ? `<p class="inter-medium edge-ratio">${bet.edge.ratio}</p>` : ''}
                </div>
              ` : ''}

              <div class="kelly-selection-section">
                <p class="inter-semibold subsection-title">💵 Position Sizing</p>
                <div class="kelly-selector">
                  <label class="inter-medium" for="kelly-select-${index}">Kelly Criterion:</label>
                  <select id="kelly-select-${index}" class="kelly-dropdown" onchange="updateBetSizing(${index})">
                    <option value="0.25">1/4 Kelly</option>
                    <option value="0.5" selected>1/2 Kelly</option>
                    <option value="0.75">3/4 Kelly</option>
                    <option value="1.0">Full Kelly</option>
                    <option value="custom">Custom</option>
                  </select>
                  <input type="number" id="kelly-custom-${index}" class="kelly-custom-input"
                         value="0.5" min="0.1" max="2.0" step="0.05"
                         style="display: none;"
                         onchange="updateBetSizing(${index})">
                </div>
                <div class="sizing-stats" id="sizing-stats-${index}">
                  <div class="stat-item">
                    <span class="inter-medium stat-label">Full Kelly %</span>
                    <span class="inter-semibold stat-value">${fullKellyPercent.toFixed(1)}%</span>
                  </div>
                  <div class="stat-item highlight">
                    <span class="inter-medium stat-label">Bet Amount</span>
                    <span class="inter-semibold stat-value" id="bet-amount-${index}">$0.00</span>
                  </div>
                  <div class="stat-item success">
                    <span class="inter-medium stat-label">If You Win</span>
                    <span class="inter-semibold stat-value" id="bet-profit-${index}">$0.00 (0% ROI)</span>
                  </div>
                </div>
              </div>

              <div class="model-info">
                ${bet.agreement ? `<p class="inter-medium">Agreement: ${bet.agreement}</p>` : ''}
              </div>
            </div>
          `;
          betsSection.innerHTML += betHtml;
        });

        // Initialize all bet sizings with default 1/2 Kelly
        data.bets.forEach((bet, index) => {
          updateBetSizing(index);
        });

        // Add summary
        if (data.summary.totalBets) {
          const summaryHtml = `
            <div class="portfolio-summary">
              <h3 class="inter-semibold">📊 Portfolio Summary</h3>
              <div class="summary-grid">
                <div class="summary-item">
                  <span class="inter-medium">Total Bets</span>
                  <span class="inter-semibold">${data.summary.totalBets}</span>
                </div>
                <div class="summary-item">
                  <span class="inter-medium">Total Wager</span>
                  <span class="inter-semibold">$${data.summary.totalWager} (${data.summary.wagerPercent}%)</span>
                </div>
                <div class="summary-item">
                  <span class="inter-medium">Potential Profit</span>
                  <span class="inter-semibold success">$${data.summary.totalProfit}</span>
                </div>
                ${data.summary.portfolioROI ? `
                  <div class="summary-item">
                    <span class="inter-medium">Portfolio ROI</span>
                    <span class="inter-semibold success">${data.summary.portfolioROI}%</span>
                  </div>
                ` : ''}
              </div>
            </div>
          `;
          betsSection.innerHTML += summaryHtml;
        }
      } else {
        betsSection.innerHTML += `
          <div class="no-bets-message">
            <h3 class="inter-semibold">🛑 No Bets Recommended Today</h3>
            <p class="inter-medium">No qualifying opportunities found. This could mean:</p>
            <ul class="inter-medium">
              <li>Models disagree significantly</li>
              <li>No contracts with sufficient edge</li>
              <li>Market is efficiently priced</li>
            </ul>
            <p class="inter-medium">💡 Sitting out is a valid strategy!</p>
          </div>
        `;
      }
    }

    function updateBetSizing(betIndex) {
      const bet = globalBetsData[betIndex];
      if (!bet) return;

      const selectEl = document.getElementById(`kelly-select-${betIndex}`);
      const customInput = document.getElementById(`kelly-custom-${betIndex}`);
      const betAmountEl = document.getElementById(`bet-amount-${betIndex}`);
      const betProfitEl = document.getElementById(`bet-profit-${betIndex}`);

      // Show/hide custom input
      if (selectEl.value === 'custom') {
        customInput.style.display = 'inline-block';
      } else {
        customInput.style.display = 'none';
      }

      // Get Kelly fraction
      let kellyFraction;
      if (selectEl.value === 'custom') {
        kellyFraction = parseFloat(customInput.value) || 0.5;
      } else {
        kellyFraction = parseFloat(selectEl.value);
      }

      // Calculate bet amount using Kelly criterion
      // Kelly % = (p * b - q) / b where p = win prob, q = lose prob, b = odds
      // We already have fullKellyPercent calculated, so we just multiply by fraction
      const adjustedKellyPercent = bet.fullKellyPercent * kellyFraction;
      const betAmount = (adjustedKellyPercent / 100) * globalBankroll;

      // Calculate potential profit if we win
      // If we bet $X at market price of P%, and we win, we get $X / P - $X profit
      // Or: profit = betAmount * (1 - marketProb) / marketProb
      const marketProb = bet.marketProbDecimal;
      const potentialProfit = betAmount * (1 - marketProb) / marketProb;

      // Calculate ROI
      const roi = betAmount > 0 ? (potentialProfit / betAmount) * 100 : 0;

      // Update display
      betAmountEl.textContent = `$${betAmount.toFixed(2)}`;
      betProfitEl.textContent = `$${potentialProfit.toFixed(2)} (${roi.toFixed(0)}% ROI)`;
    }

    function runModel() {
      // Get settings values
      const startingBankroll = document.getElementById("startingBankroll").value;
      const targetDate = document.getElementById("targetDate").value;
      const cityFilter = document.getElementById("cityFilter").value;

      // Store bankroll globally for Kelly calculations
      globalBankroll = parseFloat(startingBankroll);

      // Build URL with parameters (use full Kelly for initial calculation, user adjusts per-bet)
      let url = `/run-model?kelly=1.0&maxbet=1.0&bankroll=${startingBankroll}&dateOption=${targetDate}&city=${cityFilter}`;

      // Show loader, hide results
      document.getElementById("loader").style.display = "block";
      document.getElementById("resultsContainer").style.display = "none";

      // Increase fetch timeout to 5 minutes (matches backend timeout)
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 300000); // 5 minute timeout

      fetch(url, { signal: controller.signal })
        .then(response => response.json())
        .then(data => {
          clearTimeout(timeoutId);
          document.getElementById("loader").style.display = "none";

          // Store raw output
          document.getElementById("rawOutputBox").value = data.output || data.error || "";

          if (data.success !== false && data.output) {
            // Display prediction date
            if (data.prediction_date) {
              document.getElementById("predictionDateText").textContent =
                "Predictions for " + data.prediction_date;
            }

            // Parse and display results
            const parsedData = parseModelOutput(data.output);
            displayResults(parsedData);
            document.getElementById("resultsContainer").style.display = "block";
          } else {
            // Show error
            document.getElementById("resultsContainer").innerHTML = `
              <div class="error-message">
                <h3 class="inter-semibold">❌ Error</h3>
                <p class="inter-medium">${data.error || "Unknown error occurred"}</p>
              </div>
            `;
            document.getElementById("resultsContainer").style.display = "block";
          }
        })
        .catch(err => {
          clearTimeout(timeoutId);
          document.getElementById("loader").style.display = "none";
          
          let errorMsg = "Unknown error occurred";
          if (err.name === 'AbortError') {
            errorMsg = `Request timed out after 5 minutes.

This usually means:
• HRRR data is taking too long to fetch
• Network issues accessing weather APIs

Try:
• Running with a single city filter
• Refreshing and trying again`;
          } else {
            errorMsg = err.toString();
          }

          document.getElementById("resultsContainer").innerHTML = `
            <div class="error-message">
              <h3 class="inter-semibold">❌ Error</h3>
              <pre class="inter-medium">${errorMsg}</pre>
            </div>
          `;
          document.getElementById("resultsContainer").style.display = "block";
        });
    }
  </script>

</body>
</html>
