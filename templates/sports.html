<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="static/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <title>Kalshi Sports Bets</title>
</head>
<body>
  <nav class="navbar">
    <a href="/weather" class="nav-link inter-medium">weather</a>
    <a href="/sports" class="nav-link active inter-medium">sports</a>
  </nav>

  <div class="titles-container">
    <h1 class="inter-semibold"><span class="title-kalshi">Kalshi</span> <span class="title-sports-bets">Sports Bets</span></h1>
    <h3 class="inter-medium">With Elo Rating System</h3>
  </div>

  <div class="content-container">
    <div class="settings-container">
      <div class="setting-group">
        <label class="inter-medium" for="kellyFraction">Kelly Fraction:</label>
        <input type="number" id="kellyFraction" value="0.50" min="0.1" max="1.0" step="0.05">
      </div>
      <div class="setting-group">
        <label class="inter-medium" for="startingBankroll">Starting Bankroll ($):</label>
        <input type="number" id="startingBankroll" value="100" min="1" step="1">
      </div>
    </div>
    <button class="inter-medium button" onclick="runModel()">Generate Picks</button>
  </div>
  <div id="loader" class="loader" style="display: none;"></div>

  <!-- Results Display Area -->
  <div id="resultsContainer" class="results-container" style="display: none;">
    <!-- Elo Rankings Section -->
    <div id="rankingsSection" class="rankings-section"></div>
    
    <!-- Betting Recommendations Section -->
    <div id="betsSection" class="bets-section"></div>
  </div>

  <!-- Raw output toggle (for debugging) -->
  <div class="raw-output-container" style="display: none;">
    <button class="inter-medium toggle-raw-btn" onclick="toggleRawOutput()">Show Raw Output</button>
    <textarea id="rawOutputBox" style="display: none;"></textarea>
  </div>

  <script>
    function toggleRawOutput() {
      const rawBox = document.getElementById("rawOutputBox");
      const btn = document.querySelector(".toggle-raw-btn");
      if (rawBox.style.display === "none") {
        rawBox.style.display = "block";
        btn.textContent = "Hide Raw Output";
      } else {
        rawBox.style.display = "none";
        btn.textContent = "Show Raw Output";
      }
    }

    function parseSportsOutput(text) {
      const lines = text.split('\n');
      const data = {
        rankings: [],
        bets: [],
        summary: {}
      };

      let currentSection = null;
      let currentBet = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        // Detect sections
        if (line.includes('TOP') && line.includes('TEAMS BY ELO RATING')) {
          currentSection = 'rankings';
        } else if (line.includes('FOUND') && line.includes('BETTING OPPORTUNITIES')) {
          currentSection = 'bets';
          const match = line.match(/FOUND (\d+) BETTING/);
          if (match) data.summary.totalBets = match[1];
        } else if (line.includes('NO BETTING OPPORTUNITIES')) {
          currentSection = 'no_bets';
        }

        // Parse rankings
        if (currentSection === 'rankings' && line.match(/^\s*\d+\./)) {
          const match = line.match(/(\d+)\.\s+(.+?)\s+\|\s+Rating:\s+([\d.]+)\s+\|\s+Games:\s+(\d+)\s*(.*)/);
          if (match) {
            data.rankings.push({
              rank: match[1],
              team: match[2].trim(),
              rating: match[3],
              games: match[4],
              streak: match[5].trim()
            });
          }
        }

        // Parse bets
        if (currentSection === 'bets' && line.match(/BET #(\d+):/)) {
          if (currentBet) data.bets.push(currentBet);
          const titleMatch = line.match(/BET #(\d+):\s*(.+)/);
          currentBet = {
            number: titleMatch[1],
            title: titleMatch[2].trim(),
            betOn: '',
            opponent: '',
            eloTeam: '',
            eloOpponent: '',
            modelProb: '',
            marketPrice: '',
            edge: '',
            betSize: '',
            profit: '',
            ev: '',
            ticker: '',
            gameTime: '',
            homeAway: ''
          };
        } else if (currentBet) {
          if (line.includes('BET ON:')) {
            const match = line.match(/BET ON:\s*(.+?)\s*(🏠|✈️)/);
            if (match) {
              currentBet.betOn = match[1].trim();
              currentBet.homeAway = match[2] === '🏠' ? 'Home' : 'Away';
            }
          } else if (line.includes('OPPONENT:')) {
            currentBet.opponent = line.match(/OPPONENT:\s*(.+)/)[1].trim();
          } else if (line.includes('Elo:')) {
            const match = line.match(/Elo:\s*([\d.]+)\s*.*?vs\s*([\d.]+)/);
            if (match) {
              currentBet.eloTeam = match[1];
              currentBet.eloOpponent = match[2];
            }
          } else if (line.includes('Model probability:')) {
            currentBet.modelProb = line.match(/Model probability:\s*([\d.]+)%/)[1];
          } else if (line.includes('Market price:')) {
            const match = line.match(/Market price:\s*([\d.]+)¢.*?implies\s*([\d.]+)%/);
            if (match) {
              currentBet.marketPrice = match[1];
              currentBet.marketImplied = match[2];
            }
          } else if (line.includes('Edge:')) {
            currentBet.edge = line.match(/Edge:\s*([+-]?[\d.]+)%/)[1];
          } else if (line.includes('BET:')) {
            currentBet.betSize = line.match(/BET:\s*\$?([\d.]+)/)[1];
          } else if (line.includes('Potential profit:')) {
            currentBet.profit = line.match(/Potential profit:\s*\$?([\d.]+)/)[1];
          } else if (line.includes('Expected value:')) {
            currentBet.ev = line.match(/Expected value:\s*\$?([\d.]+)/)[1];
          } else if (line.includes('Ticker:')) {
            currentBet.ticker = line.match(/Ticker:\s*(.+)/)[1].trim();
          } else if (line.includes('Game time:')) {
            currentBet.gameTime = line.match(/Game time:\s*(.+)/)[1].trim();
          }
        }

        // Parse summary
        if (line.includes('TOTAL WAGER:')) {
          const match = line.match(/TOTAL WAGER:\s*\$?([\d.]+)\s*\(([\d.]+)%/);
          if (match) {
            data.summary.totalWager = match[1];
            data.summary.wagerPercent = match[2];
          }
        } else if (line.includes('POTENTIAL PROFIT:')) {
          data.summary.totalProfit = line.match(/POTENTIAL PROFIT:\s*\$?([\d.]+)/)[1];
        } else if (line.includes('EXPECTED VALUE:') && !currentBet) {
          data.summary.expectedValue = line.match(/EXPECTED VALUE:\s*\$?([\d.]+)/)[1];
        }
      }

      // Push last bet
      if (currentBet) data.bets.push(currentBet);

      return data;
    }

    function displaySportsResults(data) {
      const rankingsSection = document.getElementById('rankingsSection');
      const betsSection = document.getElementById('betsSection');
      
      // Clear previous results
      rankingsSection.innerHTML = '';
      betsSection.innerHTML = '';

      // Display Elo Rankings
      if (data.rankings.length > 0) {
        rankingsSection.innerHTML += '<h2 class="inter-semibold section-title">📊 Elo Rankings</h2>';
        
        const rankingsHtml = `
          <div class="rankings-card">
            <div class="rankings-table">
              ${data.rankings.map(team => `
                <div class="ranking-row">
                  <span class="inter-semibold rank-number">${team.rank}</span>
                  <span class="inter-semibold team-name">${team.team}</span>
                  <span class="inter-medium elo-rating">${team.rating}</span>
                  <span class="inter-medium games-count">${team.games} games</span>
                  ${team.streak ? `<span class="inter-medium streak">${team.streak}</span>` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        `;
        rankingsSection.innerHTML += rankingsHtml;
      }

      // Display Bets
      if (data.bets.length > 0) {
        betsSection.innerHTML += '<h2 class="inter-semibold section-title">🏀 Recommended Bets</h2>';
        
        data.bets.forEach(bet => {
          const homeAwayBadge = bet.homeAway === 'Home' ? '🏠 Home' : '✈️ Away';
          const edgeValue = parseFloat(bet.edge);
          const confidenceLevel = edgeValue >= 10 ? '🔥 HIGH CONFIDENCE' : edgeValue >= 5 ? '✅ CONFIDENT' : '📊 STANDARD';
          
          const betHtml = `
            <div class="bet-card sports-bet-card">
              <div class="bet-header">
                <span class="inter-semibold bet-number">BET #${bet.number}</span>
                <span class="inter-medium matchup">${bet.title}</span>
                <span class="inter-medium confidence-badge">${confidenceLevel}</span>
              </div>

              <div class="sports-matchup">
                <div class="team-section betting-on">
                  <p class="inter-medium label">🎰 Betting On</p>
                  <p class="inter-semibold team">${bet.betOn}</p>
                  <p class="inter-medium home-away">${homeAwayBadge}</p>
                  <p class="inter-medium elo">Elo: ${bet.eloTeam}</p>
                </div>
                <div class="vs-divider inter-semibold">VS</div>
                <div class="team-section opponent">
                  <p class="inter-medium label">🆚 Opponent</p>
                  <p class="inter-semibold team">${bet.opponent}</p>
                  <p class="inter-medium elo">Elo: ${bet.eloOpponent}</p>
                </div>
              </div>

              <div class="edge-section">
                <p class="inter-semibold subsection-title">📊 The Edge</p>
                <div class="edge-stats">
                  <div class="stat-item">
                    <span class="inter-medium stat-label">Model Probability</span>
                    <span class="inter-semibold stat-value">${bet.modelProb}%</span>
                  </div>
                  <div class="stat-item">
                    <span class="inter-medium stat-label">Market Price</span>
                    <span class="inter-semibold stat-value">${bet.marketPrice}¢</span>
                  </div>
                  <div class="stat-item highlight">
                    <span class="inter-medium stat-label">Edge</span>
                    <span class="inter-semibold stat-value">${bet.edge}%</span>
                  </div>
                </div>
              </div>

              <div class="sizing-section">
                <p class="inter-semibold subsection-title">💵 Position Sizing</p>
                <div class="sizing-stats">
                  <div class="stat-item highlight">
                    <span class="inter-medium stat-label">Bet Amount</span>
                    <span class="inter-semibold stat-value">$${bet.betSize}</span>
                  </div>
                  <div class="stat-item success">
                    <span class="inter-medium stat-label">Potential Profit</span>
                    <span class="inter-semibold stat-value">$${bet.profit}</span>
                  </div>
                  <div class="stat-item">
                    <span class="inter-medium stat-label">Expected Value</span>
                    <span class="inter-semibold stat-value">$${bet.ev}</span>
                  </div>
                </div>
              </div>

              <div class="game-info">
                ${bet.gameTime ? `<p class="inter-medium">🕒 ${bet.gameTime}</p>` : ''}
                <p class="inter-medium ticker">Ticker: ${bet.ticker}</p>
              </div>
            </div>
          `;
          betsSection.innerHTML += betHtml;
        });

        // Add summary
        if (data.summary.totalBets) {
          const summaryHtml = `
            <div class="portfolio-summary">
              <h3 class="inter-semibold">📊 Portfolio Summary</h3>
              <div class="summary-grid">
                <div class="summary-item">
                  <span class="inter-medium">Total Bets</span>
                  <span class="inter-semibold">${data.summary.totalBets}</span>
                </div>
                <div class="summary-item">
                  <span class="inter-medium">Total Wager</span>
                  <span class="inter-semibold">$${data.summary.totalWager} (${data.summary.wagerPercent}%)</span>
                </div>
                <div class="summary-item">
                  <span class="inter-medium">Potential Profit</span>
                  <span class="inter-semibold success">$${data.summary.totalProfit}</span>
                </div>
                <div class="summary-item">
                  <span class="inter-medium">Expected Value</span>
                  <span class="inter-semibold success">$${data.summary.expectedValue}</span>
                </div>
              </div>
            </div>
          `;
          betsSection.innerHTML += summaryHtml;
        }
      } else {
        betsSection.innerHTML += `
          <div class="no-bets-message">
            <h3 class="inter-semibold">❌ No Betting Opportunities Found</h3>
            <p class="inter-medium">The model found no edges meeting minimum requirements.</p>
            <p class="inter-medium">💡 This could mean:</p>
            <ul class="inter-medium">
              <li>No games available on Kalshi today</li>
              <li>Market prices are too efficient</li>
              <li>No significant edge detected</li>
            </ul>
          </div>
        `;
      }
    }

    function runModel() {
      // Get settings values
      const kellyFraction = document.getElementById("kellyFraction").value;
      const startingBankroll = document.getElementById("startingBankroll").value;

      // Build URL
      let url = `/run-sports-model?kelly=${kellyFraction}&bankroll=${startingBankroll}`;

      // Show loader, hide results
      document.getElementById("loader").style.display = "block";
      document.getElementById("resultsContainer").style.display = "none";

      // Increase fetch timeout
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 60000); // 1 minute timeout

      fetch(url, { signal: controller.signal })
        .then(response => response.json())
        .then(data => {
          clearTimeout(timeoutId);
          document.getElementById("loader").style.display = "none";

          // Store raw output
          document.getElementById("rawOutputBox").value = data.output || data.error || "";

          if (data.success !== false && data.output) {
            // Parse and display results
            const parsedData = parseSportsOutput(data.output);
            displaySportsResults(parsedData);
            document.getElementById("resultsContainer").style.display = "block";
          } else {
            // Show error
            document.getElementById("resultsContainer").innerHTML = `
              <div class="error-message">
                <h3 class="inter-semibold">❌ Error</h3>
                <p class="inter-medium">${data.error || "Unknown error occurred"}</p>
              </div>
            `;
            document.getElementById("resultsContainer").style.display = "block";
          }
        })
        .catch(err => {
          clearTimeout(timeoutId);
          document.getElementById("loader").style.display = "none";
          
          let errorMsg = "Unknown error occurred";
          if (err.name === 'AbortError') {
            errorMsg = `Request timed out after 1 minute.

Try refreshing and running again.`;
          } else {
            errorMsg = err.toString();
          }

          document.getElementById("resultsContainer").innerHTML = `
            <div class="error-message">
              <h3 class="inter-semibold">❌ Error</h3>
              <pre class="inter-medium">${errorMsg}</pre>
            </div>
          `;
          document.getElementById("resultsContainer").style.display = "block";
        });
    }
  </script>

</body>
</html>
