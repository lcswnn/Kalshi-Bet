<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="static/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <title>Kalshi Sports Bets</title>
</head>
<body>
  <nav class="navbar">
    <a href="/weather" class="nav-link inter-medium">weather</a>
    <a href="/weather-bins" class="nav-link inter-medium">weather bins</a>
    <a href="/sports" class="nav-link active inter-medium">sports</a>
  </nav>

  <div class="titles-container">
    <h1 class="inter-semibold"><span class="title-kalshi">Kalshi</span> <span class="title-sports-bets">MLB Predictions</span></h1>
    <h3 class="inter-medium">Live betting edges with Elo + Ensemble ML</h3>
  </div>

  <div class="content-container">
    <div class="settings-container">
      <div class="setting-group">
        <label class="inter-medium" for="startingBankroll">Bankroll ($):</label>
        <input type="number" id="startingBankroll" value="100" min="1" step="1">
      </div>
      <div class="setting-group">
        <label class="inter-medium" for="minEdge">Minimum Edge (%):</label>
        <input type="number" id="minEdge" value="5.0" min="1" max="20" step="0.5">
      </div>
      <div class="setting-group">
        <label class="inter-medium" for="targetDate">Date:</label>
        <select id="targetDate">
          <option value="today" selected>Today</option>
          <option value="tomorrow">Tomorrow</option>
          <option value="auto">All Available</option>
        </select>
      </div>
    </div>
    <button class="inter-medium button" onclick="runModel()">Generate Picks</button>
  </div>
  <div id="loader" class="loader" style="display: none;"></div>

  <!-- Results Display Area -->
  <div id="resultsContainer" class="results-container" style="display: none;">
    <!-- Elo Rankings Section -->
    <div id="rankingsSection" class="rankings-section"></div>

    <!-- All Matchups Section -->
    <div id="matchupsSection"></div>

    <!-- Betting Recommendations Section -->
    <div id="betsSection" class="bets-section"></div>
  </div>

  <script>
    // Global state for Kelly recalculation
    let globalBankroll = 100;
    let globalBetsData = [];

    function formatCloseTime(isoTime) {
      try {
        const dt = new Date(isoTime);
        return dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'America/New_York' }) + ' ET';
      } catch {
        return 'Unknown';
      }
    }

    function displayResults(data) {
      const rankingsSection = document.getElementById('rankingsSection');
      const matchupsSection = document.getElementById('matchupsSection');
      const betsSection = document.getElementById('betsSection');

      rankingsSection.innerHTML = '';
      matchupsSection.innerHTML = '';
      betsSection.innerHTML = '';

      // ── Elo Rankings ──
      if (data.rankings && data.rankings.length > 0) {
        rankingsSection.innerHTML = `
          <h2 class="inter-semibold section-title">Elo Rankings</h2>
          <div class="rankings-card">
            <div class="rankings-table">
              ${data.rankings.map(team => `
                <div class="ranking-row">
                  <span class="inter-semibold rank-number">${team.rank}</span>
                  <span class="inter-semibold team-name">${team.team}</span>
                  <span class="inter-medium elo-rating">${team.rating}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // ── All Matchups ──
      if (data.predictions && data.predictions.length > 0) {
        matchupsSection.innerHTML = `
          <h2 class="inter-semibold section-title">Today's Matchups</h2>
          <div class="matchups-grid">
            ${data.predictions.map(p => {
              const homeEdge = p.home_edge;
              const awayEdge = p.away_edge;
              const bestEdge = Math.max(homeEdge, awayEdge);
              const edgeClass = bestEdge >= 5 ? 'edge-good' : bestEdge >= 0 ? 'edge-neutral' : 'edge-bad';
              const vol = p.volume || 0;
              const volLabel = vol >= 10000 ? (vol / 1000).toFixed(0) + 'K' : vol.toLocaleString();
              const volClass = vol >= 5000 ? 'vol-high' : vol >= 500 ? 'vol-med' : 'vol-low';
              return `
                <div class="matchup-card">
                  <div class="matchup-teams">
                    <div class="matchup-team home">
                      <span class="inter-semibold">${p.home_abbr}</span>
                      <span class="inter-medium matchup-elo">${p.home_elo}</span>
                    </div>
                    <span class="inter-medium matchup-vs">vs</span>
                    <div class="matchup-team away">
                      <span class="inter-semibold">${p.away_abbr}</span>
                      <span class="inter-medium matchup-elo">${p.away_elo}</span>
                    </div>
                  </div>
                  <div class="matchup-details">
                    <div class="matchup-prob">
                      <span class="inter-medium">Model</span>
                      <span class="inter-semibold">${p.model_prob_home.toFixed(1)}%</span>
                    </div>
                    <div class="matchup-market">
                      <span class="inter-medium">Market</span>
                      <span class="inter-semibold">${p.yes_price}&#162;</span>
                    </div>
                    <div class="matchup-edge ${edgeClass}">
                      <span class="inter-medium">Edge</span>
                      <span class="inter-semibold">${bestEdge >= 0 ? '+' : ''}${bestEdge.toFixed(1)}%</span>
                    </div>
                    <div class="matchup-volume ${volClass}">
                      <span class="inter-medium">Vol</span>
                      <span class="inter-semibold">${volLabel}</span>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      // ── Betting Recommendations with per-bet Kelly ──
      if (data.bets && data.bets.length > 0) {
        globalBetsData = data.bets;

        betsSection.innerHTML = `<h2 class="inter-semibold section-title">Recommended Bets</h2>`;

        data.bets.forEach((bet, index) => {
          // Calculate full Kelly for this bet
          const winProb = bet.model_prob / 100;
          const marketProb = bet.market_price / 100;
          const odds = (1 - marketProb) / marketProb;
          const fullKelly = winProb - ((1 - winProb) / odds);
          const fullKellyPercent = Math.max(0, fullKelly * 100);

          // Store for recalculation
          bet.fullKellyPercent = fullKellyPercent;
          bet.winProbDecimal = winProb;
          bet.marketProbDecimal = marketProb;

          const edgeValue = bet.edge;
          const confidenceLabel = edgeValue >= 10 ? 'HIGH CONFIDENCE' : edgeValue >= 5 ? 'CONFIDENT' : 'STANDARD';

          const betHtml = `
            <div class="bet-card sports-bet-card" id="bet-card-${index}">
              <div class="bet-header">
                <span class="inter-semibold bet-number">BET #${index + 1}</span>
                <span class="inter-medium matchup">${bet.bet_on} vs ${bet.opponent}</span>
                <span class="inter-medium confidence-badge">${confidenceLabel}</span>
              </div>

              <div class="sports-matchup">
                <div class="team-section betting-on">
                  <p class="inter-medium label">Betting On</p>
                  <p class="inter-semibold team">${bet.bet_on} (${bet.bet_abbr})</p>
                  <p class="inter-medium home-away">${bet.home_away === 'Home' ? 'Home' : 'Away'}</p>
                  <p class="inter-medium elo">Elo: ${bet.elo_team}</p>
                </div>
                <div class="vs-divider inter-semibold">VS</div>
                <div class="team-section opponent">
                  <p class="inter-medium label">Opponent</p>
                  <p class="inter-semibold team">${bet.opponent} (${bet.opponent_abbr})</p>
                  <p class="inter-medium elo">Elo: ${bet.elo_opponent}</p>
                </div>
              </div>

              <div class="edge-section">
                <p class="inter-semibold subsection-title">The Edge</p>
                <div class="edge-stats">
                  <div class="stat-item">
                    <span class="inter-medium stat-label">Model Probability</span>
                    <span class="inter-semibold stat-value">${bet.model_prob.toFixed(1)}%</span>
                  </div>
                  <div class="stat-item">
                    <span class="inter-medium stat-label">Market Price</span>
                    <span class="inter-semibold stat-value">${bet.market_price}&#162; (${bet.market_implied}%)</span>
                  </div>
                  <div class="stat-item highlight">
                    <span class="inter-medium stat-label">Edge</span>
                    <span class="inter-semibold stat-value">+${bet.edge.toFixed(1)}%</span>
                  </div>
                </div>
              </div>

              <div class="kelly-selection-section">
                <p class="inter-semibold subsection-title">Position Sizing</p>
                <div class="kelly-selector">
                  <label class="inter-medium" for="kelly-select-${index}">Kelly Criterion:</label>
                  <select id="kelly-select-${index}" class="kelly-dropdown" onchange="updateBetSizing(${index})">
                    <option value="0.25">1/4 Kelly</option>
                    <option value="0.5" selected>1/2 Kelly</option>
                    <option value="0.75">3/4 Kelly</option>
                    <option value="1.0">Full Kelly</option>
                    <option value="custom">Custom</option>
                  </select>
                  <input type="number" id="kelly-custom-${index}" class="kelly-custom-input"
                         value="0.5" min="0.1" max="2.0" step="0.05"
                         style="display: none;"
                         onchange="updateBetSizing(${index})">
                </div>
                <div class="sizing-stats" id="sizing-stats-${index}">
                  <div class="stat-item">
                    <span class="inter-medium stat-label">Full Kelly %</span>
                    <span class="inter-semibold stat-value">${fullKellyPercent.toFixed(1)}%</span>
                  </div>
                  <div class="stat-item highlight">
                    <span class="inter-medium stat-label">Bet Amount</span>
                    <span class="inter-semibold stat-value" id="bet-amount-${index}">$0.00</span>
                  </div>
                  <div class="stat-item success">
                    <span class="inter-medium stat-label">If You Win</span>
                    <span class="inter-semibold stat-value" id="bet-profit-${index}">$0.00 (0% ROI)</span>
                  </div>
                  <div class="stat-item">
                    <span class="inter-medium stat-label">Expected Value</span>
                    <span class="inter-semibold stat-value" id="bet-ev-${index}">$0.00</span>
                  </div>
                </div>
              </div>

              <div class="game-info">
                ${bet.close_time ? `<p class="inter-medium">Game: ${formatCloseTime(bet.close_time)}</p>` : ''}
                <p class="inter-medium ticker">Ticker: ${bet.ticker}</p>
                ${bet.volume !== undefined ? `<p class="inter-medium volume-info ${(bet.volume || 0) >= 5000 ? 'vol-high' : (bet.volume || 0) >= 500 ? 'vol-med' : 'vol-low'}">Volume: ${(bet.volume || 0).toLocaleString()} contracts</p>` : ''}
              </div>
            </div>
          `;
          betsSection.innerHTML += betHtml;
        });

        // Initialize all bet sizings with default 1/2 Kelly
        data.bets.forEach((_, index) => {
          updateBetSizing(index);
        });

        // Add dynamic portfolio summary
        betsSection.innerHTML += `
          <div class="portfolio-summary" id="portfolioSummary">
            <h3 class="inter-semibold">Portfolio Summary</h3>
            <div class="summary-grid">
              <div class="summary-item">
                <span class="inter-medium">Total Bets</span>
                <span class="inter-semibold" id="summaryTotalBets">${data.bets.length}</span>
              </div>
              <div class="summary-item">
                <span class="inter-medium">Total Wager</span>
                <span class="inter-semibold" id="summaryTotalWager">$0.00</span>
              </div>
              <div class="summary-item">
                <span class="inter-medium">Potential Profit</span>
                <span class="inter-semibold success" id="summaryTotalProfit">$0.00</span>
              </div>
              <div class="summary-item">
                <span class="inter-medium">Expected Value</span>
                <span class="inter-semibold success" id="summaryTotalEV">$0.00</span>
              </div>
            </div>
          </div>
        `;

        // Update summary after all bets initialized
        updatePortfolioSummary();

      } else {
        betsSection.innerHTML = `
          <div class="no-bets-message">
            <h3 class="inter-semibold">No Betting Opportunities Found</h3>
            <p class="inter-medium">The model found no edges meeting minimum requirements.</p>
            <p class="inter-medium">This could mean:</p>
            <ul class="inter-medium">
              <li>No games available on Kalshi today</li>
              <li>Market prices are too efficient</li>
              <li>No significant edge detected</li>
            </ul>
          </div>
        `;
      }
    }

    function updateBetSizing(betIndex) {
      const bet = globalBetsData[betIndex];
      if (!bet) return;

      const selectEl = document.getElementById(`kelly-select-${betIndex}`);
      const customInput = document.getElementById(`kelly-custom-${betIndex}`);
      const betAmountEl = document.getElementById(`bet-amount-${betIndex}`);
      const betProfitEl = document.getElementById(`bet-profit-${betIndex}`);
      const betEvEl = document.getElementById(`bet-ev-${betIndex}`);

      // Show/hide custom input
      if (selectEl.value === 'custom') {
        customInput.style.display = 'inline-block';
      } else {
        customInput.style.display = 'none';
      }

      // Get Kelly fraction
      let kellyFraction;
      if (selectEl.value === 'custom') {
        kellyFraction = parseFloat(customInput.value) || 0.5;
      } else {
        kellyFraction = parseFloat(selectEl.value);
      }

      // Calculate bet amount
      const adjustedKellyPercent = bet.fullKellyPercent * kellyFraction;
      const betAmount = Math.min((adjustedKellyPercent / 100) * globalBankroll, globalBankroll * 0.20);

      // Calculate potential profit and EV
      const marketProb = bet.marketProbDecimal;
      const potentialProfit = betAmount * (1 - marketProb) / marketProb;
      const roi = betAmount > 0 ? (potentialProfit / betAmount) * 100 : 0;
      const ev = betAmount * bet.edge / 100;

      // Store for summary
      bet._currentBetAmount = betAmount;
      bet._currentProfit = potentialProfit;
      bet._currentEV = ev;

      // Update display
      betAmountEl.textContent = `$${betAmount.toFixed(2)}`;
      betProfitEl.textContent = `$${potentialProfit.toFixed(2)} (${roi.toFixed(0)}% ROI)`;
      betEvEl.textContent = `$${ev.toFixed(2)}`;

      // Update portfolio summary
      updatePortfolioSummary();
    }

    function updatePortfolioSummary() {
      const totalWagerEl = document.getElementById('summaryTotalWager');
      const totalProfitEl = document.getElementById('summaryTotalProfit');
      const totalEVEl = document.getElementById('summaryTotalEV');

      if (!totalWagerEl) return;

      let totalWager = 0;
      let totalProfit = 0;
      let totalEV = 0;

      globalBetsData.forEach(bet => {
        totalWager += bet._currentBetAmount || 0;
        totalProfit += bet._currentProfit || 0;
        totalEV += bet._currentEV || 0;
      });

      const wagerPercent = globalBankroll > 0 ? (totalWager / globalBankroll * 100).toFixed(1) : 0;

      totalWagerEl.textContent = `$${totalWager.toFixed(2)} (${wagerPercent}%)`;
      totalProfitEl.textContent = `$${totalProfit.toFixed(2)}`;
      totalEVEl.textContent = `$${totalEV.toFixed(2)}`;
    }

    function runModel() {
      const startingBankroll = document.getElementById("startingBankroll").value;
      const minEdge = document.getElementById("minEdge").value;
      const targetDate = document.getElementById("targetDate").value;

      globalBankroll = parseFloat(startingBankroll);

      let url = `/run-sports-model?bankroll=${startingBankroll}&minEdge=${minEdge}&dateOption=${targetDate}`;

      document.getElementById("loader").style.display = "block";
      document.getElementById("resultsContainer").style.display = "none";

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 60000);

      fetch(url, { signal: controller.signal })
        .then(response => response.json())
        .then(result => {
          clearTimeout(timeoutId);
          document.getElementById("loader").style.display = "none";

          if (result.success && result.data) {
            if (result.data.error === 'no_games') {
              document.getElementById("resultsContainer").innerHTML = `
                <div class="no-bets-message">
                  <h3 class="inter-semibold">No MLB Games Found</h3>
                  <p class="inter-medium">This could mean:</p>
                  <ul class="inter-medium">
                    <li>It's the off-season</li>
                    <li>No games are scheduled today</li>
                    <li>Kalshi API is unavailable</li>
                  </ul>
                </div>
              `;
              document.getElementById("resultsContainer").style.display = "block";
              return;
            }

            displayResults(result.data);
            document.getElementById("resultsContainer").style.display = "block";
          } else {
            document.getElementById("resultsContainer").innerHTML = `
              <div class="error-message">
                <h3 class="inter-semibold">Error</h3>
                <p class="inter-medium">${result.error || "Unknown error occurred"}</p>
              </div>
            `;
            document.getElementById("resultsContainer").style.display = "block";
          }
        })
        .catch(err => {
          clearTimeout(timeoutId);
          document.getElementById("loader").style.display = "none";

          let errorMsg = "Unknown error occurred";
          if (err.name === 'AbortError') {
            errorMsg = "Request timed out after 1 minute. Try refreshing and running again.";
          } else {
            errorMsg = err.toString();
          }

          document.getElementById("resultsContainer").innerHTML = `
            <div class="error-message">
              <h3 class="inter-semibold">Error</h3>
              <pre class="inter-medium">${errorMsg}</pre>
            </div>
          `;
          document.getElementById("resultsContainer").style.display = "block";
        });
    }
  </script>

</body>
</html>
